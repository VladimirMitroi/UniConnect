version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: uniconnect-postgres
    environment:
      POSTGRES_USER: uniconnect_user
      POSTGRES_PASSWORD: uniconnect_password
      POSTGRES_DB: uniconnect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uniconnect_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: uniconnect-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@uniconnect.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - uniconnect_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: uniconnect-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Portul pentru aplicatii (Spring/FastAPI)
      - "15672:15672" # Portul pentru interfata web de management
    networks:
      - uniconnect_network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: uniconnect-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API Port
      - "9001:9001"   # Console Port
    volumes:
      - minio_data:/data
    networks:
      - uniconnect_network
    restart: unless-stopped

networks:
  uniconnect_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data: